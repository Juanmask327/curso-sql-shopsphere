version: "3.9"

# ============================================================
# ShopSphere — Docker Compose (base)
# Servicios definidos aquí son válidos para todos los ambientes.
# Los overrides específicos de desarrollo local viven en
# docker-compose.override.yml (Docker Compose lo aplica automáticamente).
#
# Arquitectura de sandboxing (Decisión 1):
#   El SQL Playground corre en el navegador vía sql.js/WASM.
#   No hay playground-db: el aislamiento es por diseño de arquitectura,
#   no por configuración de infraestructura.
# ============================================================

services:

  # ----------------------------------------------------------
  # Backend — Node.js 22 + Fastify + TypeScript
  # Puerto interno: 3001
  # Hot-reload en dev: tsx watch (ver override)
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: shopsphere-backend
    restart: unless-stopped
    working_dir: /app
    command: npm run dev
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopsphere_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopsphere}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      REDIS_URL: redis://redis:6379
      REDIS_TLS: "false"
      # En staging/prod definir REDIS_PASSWORD y proteger Redis con --requirepass.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_ACCESS: ${JWT_EXPIRY_ACCESS:-15m}
      JWT_EXPIRY_REFRESH: ${JWT_EXPIRY_REFRESH:-7d}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      PLAYGROUND_WORKER_POOL_SIZE: ${PLAYGROUND_WORKER_POOL_SIZE:-8}
      PLAYGROUND_QUERY_TIMEOUT_MS: ${PLAYGROUND_QUERY_TIMEOUT_MS:-5000}
      PLAYGROUND_RATE_LIMIT_RPM: ${PLAYGROUND_RATE_LIMIT_RPM:-60}
      PLAYGROUND_DATASET_PATH: ./data/dataset.db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./data:/app/data
      - ./dataset:/dataset
      - ./modulos:/modulos
      - ./contenido:/contenido
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - frontend

  # ----------------------------------------------------------
  # Frontend — Next.js 15 + TypeScript + Tailwind
  # Puerto interno: 3000
  # WATCHPACK_POLLING para hot-reload en Windows/WSL
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: shopsphere-frontend
    restart: unless-stopped
    working_dir: /app
    command: npm run dev
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - frontend

  # ----------------------------------------------------------
  # PostgreSQL 16 — Base de datos de la plataforma
  # Almacena: users, sessions, levels, exercises, progress,
  #           exercise_attempts, certificates
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: shopsphere-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopsphere}
      POSTGRES_USER: ${POSTGRES_USER:-shopsphere_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT_EXPOSED:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopsphere_user} -d ${POSTGRES_DB:-shopsphere}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  # ----------------------------------------------------------
  # Redis 7 — Rate limiting del Playground, cache de ejercicios,
  #           sesiones de usuario
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: shopsphere-redis
    restart: unless-stopped
    # Sin contraseña en dev para simplificar. En prod usar REDIS_URL con auth.
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT_EXPOSED:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # ----------------------------------------------------------
  # Adminer — UI para inspeccionar PostgreSQL en desarrollo
  # Solo tiene puerto expuesto en docker-compose.override.yml
  # En producción este servicio no existe.
  # ----------------------------------------------------------
  adminer:
    image: adminer:4
    container_name: shopsphere-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - backend

# ============================================================
# Redes — aislamiento explícito por capa
# ============================================================
networks:
  backend:
    driver: bridge
    name: shopsphere-backend
  frontend:
    driver: bridge
    name: shopsphere-frontend

# ============================================================
# Volúmenes — persistencia entre reinicios
# ============================================================
volumes:
  postgres_data:
    name: shopsphere-postgres-data
  redis_data:
    name: shopsphere-redis-data
