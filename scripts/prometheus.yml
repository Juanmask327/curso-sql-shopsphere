# ============================================================
# Prometheus — Configuración de scraping para ShopSphere
#
# Referenciado desde docker-compose.monitoring.yml.
# El backend expone métricas en GET /metrics (formato Prometheus).
# ============================================================

global:
  scrape_interval:     15s   # Con qué frecuencia recolectar métricas
  evaluation_interval: 15s   # Con qué frecuencia evaluar reglas de alerta
  # scrape_timeout tiene un default de 10s por scrape_interval

  external_labels:
    environment: 'local'
    project:     'shopsphere'

# ── Reglas de alerta (por ahora vacío, agregar cuando haya alertmanager) ──
# rule_files:
#   - "alert.rules.yml"

# ── Targets de scraping ───────────────────────────────────────
scrape_configs:

  # Backend de ShopSphere — métricas de la aplicación
  # El backend debe exponer GET /metrics en formato Prometheus.
  # Usar prom-client (Node.js) o similar para instrumentar.
  - job_name: 'shopsphere-backend'
    static_configs:
      - targets: ['backend:3001']
        labels:
          service: 'backend'
          component: 'api'
    metrics_path: /metrics
    scrape_interval: 15s

  # Prometheus se auto-monitorea
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'monitoring'
          component: 'prometheus'

# ── Métricas clave a monitorear en el backend ─────────────────
# El backend debe exponer (via prom-client):
#
#   playground_query_duration_ms (histogram)
#     — Latencia de cada query de validación (p50/p95/p99)
#     — Alert: p95 > 1500ms
#
#   playground_worker_pool_utilization (gauge)
#     — % del pool de workers en uso
#     — Alert: > 80% sostenido por > 2 min
#
#   http_request_duration_seconds (histogram, estándar de prom-client)
#     — Latencia de todos los endpoints
#
#   http_requests_total (counter, por método + ruta + status)
#     — Tasa de errores: sum(rate(http_requests_total{status=~"5.."}[5m]))
#
#   playground_rate_limit_blocked_total (counter)
#     — Cuántos requests bloqueados por rate limiting
#     — Útil para detectar abuso
