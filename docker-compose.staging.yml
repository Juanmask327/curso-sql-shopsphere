# ============================================================
# ShopSphere — Docker Compose Staging
#
# Simula produccion localmente con imagenes buildeadas.
# Diferencias vs docker-compose.yml (dev):
#   - Sin volumenes de codigo fuente (no hay hot-reload)
#   - Build con target:prod en todos los servicios
#   - NODE_ENV=production en backend
#   - Next.js en modo "next start" (build de produccion)
#   - Sin adminer ni herramientas de admin
#   - 2 replicas del backend para probar load balancing
#   - Variables desde .env.staging (nunca .env de dev)
#
# Uso:
#   cp .env.staging.example .env.staging
#   # editar .env.staging con valores reales de staging
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up --build
#
# Para reconstruir desde cero:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up --build --force-recreate
# ============================================================

version: "3.9"

services:

  # ----------------------------------------------------------
  # Backend — imagen de produccion, 2 replicas
  # Sin volumen de codigo fuente: usa el build compilado.
  # El load balancer (el servicio "lb" abajo) distribuye entre replicas.
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    image: shopsphere-backend:staging
    restart: unless-stopped
    # Sin container_name fijo — permite multiples replicas
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      REDIS_URL: ${REDIS_URL}
      REDIS_TLS: ${REDIS_TLS:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_ACCESS: ${JWT_EXPIRY_ACCESS:-15m}
      JWT_EXPIRY_REFRESH: ${JWT_EXPIRY_REFRESH:-7d}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      PLAYGROUND_WORKER_POOL_SIZE: ${PLAYGROUND_WORKER_POOL_SIZE:-4}
      PLAYGROUND_QUERY_TIMEOUT_MS: ${PLAYGROUND_QUERY_TIMEOUT_MS:-5000}
      PLAYGROUND_RATE_LIMIT_RPM: ${PLAYGROUND_RATE_LIMIT_RPM:-60}
      CORS_ORIGIN: ${CORS_ORIGIN}
    # Sin volumenes de codigo: la imagen es inmutable
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis-staging:
        condition: service_healthy
    networks:
      - staging-backend
      - staging-frontend

  # ----------------------------------------------------------
  # Nginx — load balancer frente a las 2 replicas del backend
  # Distribuye trafico round-robin. En produccion real esto lo
  # hace Railway/Fly.io automaticamente; aqui lo simulamos.
  # ----------------------------------------------------------
  lb:
    image: nginx:1.27-alpine
    container_name: shopsphere-staging-lb
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - staging-backend
      - staging-frontend

  # ----------------------------------------------------------
  # Frontend — imagen de produccion con Next.js standalone
  # "next start" sirve el build compilado, no el dev server
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: shopsphere-frontend:staging
    container_name: shopsphere-staging-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      # NEXT_PUBLIC_* ya estan baked en el build — estas son server-side
      API_INTERNAL_SECRET: ${API_INTERNAL_SECRET}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - lb
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - staging-frontend

  # ----------------------------------------------------------
  # Redis staging — sin persistencia (staging es efimero)
  # En staging real: Upstash Redis. Aqui simulamos con Redis local
  # configurado con autenticacion para paridad con produccion.
  # ----------------------------------------------------------
  redis-staging:
    image: redis:7-alpine
    container_name: shopsphere-staging-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-staging_redis_password}
      --save ""
      --appendonly no
      --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-staging_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - staging-backend
    # Sin volumenes: staging es efimero, los datos no persisten

# ============================================================
# NOTA: PostgreSQL no aparece aqui.
# En staging, DATABASE_URL apunta directamente a Neon (cloud).
# Esto verifica que la conectividad con la DB de produccion
# real funciona antes del go-live.
# ============================================================

networks:
  staging-backend:
    driver: bridge
    name: shopsphere-staging-backend
  staging-frontend:
    driver: bridge
    name: shopsphere-staging-frontend

# Sin volumenes nombrados: staging es stateless por diseno
